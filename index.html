<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border: 2px solid #000;
            font-size: 2rem;
            cursor: pointer;
        }
        .game-over {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 20px;
        }
        .reset-btn {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        .reset-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div>
        <div class="game-board" id="gameBoard">
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
            <div class="cell" data-cell></div>
        </div>
        <div class="game-over" id="gameOverMessage"></div>
        <button class="reset-btn" id="resetButton">Restart Game</button>
        <button class="reset-btn" id="modeButton">Play Against Bot</button>
    </div>

    <script>
        const board = document.getElementById('gameBoard');
        const cells = document.querySelectorAll('[data-cell]');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const resetButton = document.getElementById('resetButton');
        const modeButton = document.getElementById('modeButton');

        let currentPlayer = 'X';
        let gameOver = false;
        let boardState = ['', '', '', '', '', '', '', '', ''];
        let isBotMode = false; // Flag to switch between human vs human or human vs bot

        const winningCombinations = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],  // Horizontal
            [0, 3, 6], [1, 4, 7], [2, 5, 8],  // Vertical
            [0, 4, 8], [2, 4, 6]              // Diagonal
        ];

        function checkWinner() {
            for (let combination of winningCombinations) {
                const [a, b, c] = combination;
                if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
                    gameOver = true;
                    gameOverMessage.textContent = `${currentPlayer} wins!`;
                    return;
                }
            }
            if (!boardState.includes('')) {
                gameOver = true;
                gameOverMessage.textContent = "It's a draw!";
            }
        }

        function handleCellClick(e) {
            const cell = e.target;
            const index = Array.from(cells).indexOf(cell);

            if (gameOver || boardState[index]) return;

            boardState[index] = currentPlayer;
            cell.textContent = currentPlayer;

            checkWinner();

            if (!gameOver) {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                if (isBotMode && currentPlayer === 'O') {
                    setTimeout(botMove, 500);  // Let bot play after a short delay
                }
            }
        }

        function botMove() {
            let availableMoves = [];
            boardState.forEach((cell, index) => {
                if (cell === '') availableMoves.push(index);
            });

            const randomMove = availableMoves[Math.floor(Math.random() * availableMoves.length)];
            boardState[randomMove] = 'O';
            cells[randomMove].textContent = 'O';

            checkWinner();
            if (!gameOver) {
                currentPlayer = 'X';
            }
        }

        function resetGame() {
            gameOver = false;
            currentPlayer = 'X';
            boardState = ['', '', '', '', '', '', '', '', ''];
            cells.forEach(cell => cell.textContent = '');
            gameOverMessage.textContent = '';
        }

        function switchMode() {
            isBotMode = !isBotMode;
            resetGame();
            modeButton.textContent = isBotMode ? "Play Against Friend" : "Play Against Bot";
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', resetGame);
        modeButton.addEventListener('click', switchMode);
    </script>
</body>
</html>
